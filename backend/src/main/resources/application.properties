# Application
spring.application.name=educonnect
server.port=8080

# MySQL Database Auto Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/educonnect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=EduConnectSuperSecretKeyForJWTSigning2024MustBeAtLeast256BitsLong
jwt.expiration=900000
jwt.refresh-expiration=604800000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.educonnect=DEBUG
logging.level.org.springframework.security=DEBUG

# Email Settings (Using MailDev for local testing)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
