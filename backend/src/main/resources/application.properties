# Application
spring.application.name=educonnect
server.port=8080

# Production Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/educonnect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Configuration
# Use 'validate' or 'none' for production to prevent accidental schema changes
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (MUST be provided via ENV in production)
jwt.secret=${JWT_SECRET:EduConnectSuperSecretKeyForJWTSigning2024MustBeAtLeast256BitsLong}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# CORS Configuration (Set to production domain in deployment)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://educonnect.com}

# Logging
logging.level.com.educonnect=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# Email Settings (Use real SMTP in production e.g., SendGrid/AWS SES)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
server.error.include-stacktrace=never

# Application Features
app.features.enable-seeder=${ENABLE_SEEDER:false}
